<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Evaluación - Física</title>

  <!-- KaTeX CSS y JS (Renderizado tipográfico ultrarrápido y perfecto) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --primary: #0284c7;
      --primary-light: #f0f9ff;
      --border-color: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --bg-main: #f8fafc;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      user-select: none; /* Seguridad: Deshabilita selección de texto */
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-main);
      margin: 0;
      padding: 30px 20px;
      color: var(--text-main);
    }

    .container {
      display: flex;
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Tarjeta Principal */
    .main-content {
      flex: 1;
      background: #ffffff;
      border-radius: 16px;
      padding: 32px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    .category {
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .question-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
      color: #0f172a;
    }

    .enunciado-text {
      font-size: 16px;
      line-height: 1.6;
      color: #334155;
    }

    /* Caja de Fórmula Destacada */
    .formula-card {
      background: #f1f5f9;
      border-left: 4px solid var(--primary);
      border-radius: 0 12px 12px 0;
      padding: 20px;
      margin: 20px 0;
      text-align: center;
      font-size: 1.25em;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
    }

    /* Opciones de Respuesta */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }

    .option-card {
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #ffffff;
      transition: all 0.2s ease;
      font-size: 15px;
    }

    .option-card:hover {
      border-color: var(--primary);
      background-color: var(--primary-light);
    }

    .option-card input[type="radio"] {
      accent-color: var(--primary);
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    /* Sidebar */
    .sidebar {
      width: 290px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .side-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 10px -2px rgba(0, 0, 0, 0.03);
    }

    .side-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .timer-display {
      font-size: 32px;
      font-weight: 800;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }

    /* Cuadrícula de Navegación */
    .grid-nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .nav-btn {
      aspect-ratio: 1;
      border: 1px solid var(--border-color);
      background: #ffffff;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .nav-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.3);
    }
  </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
  <main class="main-content">
    <div class="category" id="categoria">VECTOR POSICIÓN</div>
    <div class="question-title" id="pregunta-titulo">Pregunta 3 de 40</div>
    
    <div class="enunciado-text" id="enunciado"></div>
    <div class="options-grid" id="opciones-container"></div>
  </main>

  <aside class="sidebar">
    <div class="side-card">
      <div class="side-title">TIEMPO RESTANTE</div>
      <div class="timer-display">59:54</div>
    </div>

    <div class="side-card">
      <div class="side-title">ESTADO DEL EXAMEN</div>
      <div style="font-size: 15px; font-weight: 600; margin-top: 4px;">
        Respondidas: <span style="color: var(--primary);">0</span> / 40
      </div>
    </div>

    <div class="side-card">
      <div class="side-title">NAVEGACIÓN DIRECTA</div>
      <div class="grid-nav" id="grid-navegacion"></div>
    </div>
  </aside>
</div>

<script>
  // BANCO DE PREGUNTAS
  // Se utiliza \hat{\imath} y \hat{\jmath} para eliminar el punto de las letras i/j y lograr una tipografía perfecta.
  const preguntas = [
    {
      id: 3,
      categoria: "VECTOR POSICIÓN",
      textoInicial: "Un móvil parte desde el origen $(0,0)$ y se desplaza según el vector posición:",
      ecuacionDestacada: "$$\\vec{r}(t) = (3t\\hat{\\imath} + 4t^2\\hat{\\jmath})\\text{ m}$$",
      textoFinal: "Determinar el vector posición en $t = 2\\text{ s}$:",
      opciones: [
        "$\\vec{r}(2) = (6\\hat{\\imath} + 16\\hat{\\jmath})\\text{ m}$",
        "$\\vec{r}(2) = (3\\hat{\\imath} + 8\\hat{\\jmath})\\text{ m}$",
        "$\\vec{r}(2) = (6\\hat{\\imath} + 8\\hat{\\jmath})\\text{ m}$",
        "$\\vec{r}(2) = (12\\hat{\\imath} + 16\\hat{\\jmath})\\text{ m}$"
      ]
    }
  ];

  function cargarPregunta(index) {
    const data = preguntas[index];
    
    document.getElementById("categoria").innerText = data.categoria;
    document.getElementById("pregunta-titulo").innerText = `Pregunta ${data.id} de 40`;
    
    // Inyección de HTML
    document.getElementById("enunciado").innerHTML = `
      <p style="margin: 0 0 12px 0;">${data.textoInicial}</p>
      <div class="formula-card">${data.ecuacionDestacada}</div>
      <p style="margin: 12px 0 0 0;">${data.textoFinal}</p>
    `;

    const contenedorOpciones = document.getElementById("opciones-container");
    contenedorOpciones.innerHTML = "";

    data.opciones.forEach((opcion, i) => {
      const label = document.createElement("label");
      label.className = "option-card";
      label.innerHTML = `
        <input type="radio" name="pregunta_${data.id}" value="${i}">
        <span>${opcion}</span>
      `;
      contenedorOpciones.appendChild(label);
    });

    // RENDERIZADO TIPOGRÁFICO CON KATEX
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });
    }
  }

  // Generar cuadrícula de botones
  const grid = document.getElementById("grid-navegacion");
  for (let i = 1; i <= 40; i++) {
    const btn = document.createElement("div");
    btn.className = `nav-btn ${i === 3 ? 'active' : ''}`;
    btn.innerText = i;
    grid.appendChild(btn);
  }

  // CAPAS DE SEGURIDAD
  // 1. Deshabilitar combinaciones de teclas para copia e inspección
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' || 
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
      (e.ctrlKey && (e.key === 'u' || e.key === 'c' || e.key === 'a' || e.key === 's'))
    ) {
      e.preventDefault();
    }
  });

  // 2. Detección de cambio de pestaña
  document.addEventListener("visibilitychange", function() {
    if (document.hidden) {
      console.warn("Seguridad: Intento de cambio de pestaña detectado.");
    }
  });

  // Carga al iniciar la página
  window.addEventListener("DOMContentLoaded", () => {
    // Espera breve para asegurar la carga completa de los scripts de KaTeX
    setTimeout(() => {
      cargarPregunta(0);
    }, 100);
  });
</script>

</body>
</html>
