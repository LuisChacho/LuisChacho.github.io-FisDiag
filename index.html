<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Examen de Física - Plataforma de Evaluación</title>
  
  <!-- MathJax para renderizado de fórmulas LaTeX -->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden; /* Evita scroll global */
    }

    /* Layout principal dividido en 2 columnas */
    .app-container {
      display: grid;
      grid-template-columns: 1fr 340px; /* Columna izquierda flexible, columna derecha fija */
      height: 100vh;
      width: 100vw;
    }

    /* ÁREA PRINCIPAL DE LA PREGUNTA (Izquierda) */
    .main-panel {
      padding: 2.5rem;
      overflow-y: auto; /* Scroll independiente si la pregunta es muy larga */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .question-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 2rem;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .topic-tag {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .question-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .question-statement {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .equation-container {
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 1rem;
      margin: 1rem 0 1.5rem 0;
      border-radius: 0 8px 8px 0;
      text-align: center;
      font-size: 1.1rem;
    }

    /* Opciones de respuesta */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .option-card {
      display: flex;
      align-items: center;
      padding: 1rem 1.25rem;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--bg-card);
    }

    .option-card:hover {
      border-color: #93c5fd;
      background-color: #f8fafc;
    }

    .option-card.selected {
      border-color: var(--primary);
      background-color: #eff6ff;
    }

    .option-card input[type="radio"] {
      margin-right: 1rem;
      width: 1.2rem;
      height: 1.2rem;
      accent-color: var(--primary);
    }

    /* Botones de Navegación */
    .action-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    /* PANEL LATERAL DE NAVEGACIÓN (Derecha) */
    .sidebar-panel {
      background: var(--bg-card);
      border-left: 1px solid var(--border-color);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      box-shadow: -4px 0 10px rgba(0, 0, 0, 0.02);
    }

    .widget-box {
      background: #f8fafc;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .widget-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .timer-text {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
    }

    /* Cuadrícula de 40 preguntas */
    .grid-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .questions-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
      overflow-y: auto;
      padding-right: 4px;
      margin-top: 0.75rem;
    }

    .q-btn {
      aspect-ratio: 1;
      border: 1px solid var(--border-color);
      background: white;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .q-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Estado: Respondida */
    .q-btn.answered {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Estado: Pregunta Actual */
    .q-btn.current {
      outline: 3px solid #93c5fd;
      font-weight: 800;
    }

    /* Adaptabilidad en pantallas pequeñas */
    @media (max-width: 850px) {
      .app-container {
        grid-template-columns: 1fr;
        height: auto;
      }
      body {
        overflow: auto;
      }
      .sidebar-panel {
        border-left: none;
        border-top: 1px solid var(--border-color);
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- COLUMNA IZQUIERDA: PREGUNTA Y OPCIONES -->
    <main class="main-panel">
      <div>
        <div class="question-card" id="question-card">
          <!-- Contenido renderizado por JavaScript -->
        </div>
      </div>

      <div class="action-buttons">
        <button class="btn btn-secondary" id="btn-prev" onclick="navigate(-1)">◄ Anterior</button>
        <button class="btn btn-primary" id="btn-next" onclick="navigate(1)">Siguiente ►</button>
      </div>
    </main>

    <!-- COLUMNA DERECHA: RECUADRO LATERAL DE PREGUNTAS -->
    <aside class="sidebar-panel">
      
      <!-- Cronómetro -->
      <div class="widget-box">
        <div class="widget-label">Tiempo Restante</div>
        <div class="timer-text" id="timer">48:52</div>
      </div>

      <!-- Indicador de Progreso -->
      <div class="widget-box">
        <div class="widget-label">Estado del Examen</div>
        <div id="progress-text" style="font-weight: 600; font-size: 0.95rem;">Respondidas: 0 / 40</div>
      </div>

      <!-- Panel de Selección Directa (40 Preguntas) -->
      <div class="grid-container">
        <div class="widget-label">Navegación Directa</div>
        <div class="questions-grid" id="questions-grid">
          <!-- Se generan dinámicamente los 40 botones -->
        </div>
      </div>

    </aside>

  </div>

  <script>
    const TOTAL_QUESTIONS = 40;
    let currentQuestionIndex = 7; // Inicia en la pregunta 8 (Índice 7)
    let answers = new Array(TOTAL_QUESTIONS).fill(null);

    // Banco de datos (Soporta 40 preguntas)
    const examData = Array.from({ length: TOTAL_QUESTIONS }, (_, i) => {
      const qNum = i + 1;
      return {
        id: qNum,
        topic: "MRU Vectorial en i, j",
        statement: `Un avión se desplaza a velocidad constante durante \\(t = ${qNum % 5 + 1}\\text{ h}\\):`,
        equation: `\\vec{v} = (${100 * qNum}\\hat{i} + 300\\hat{j})\\text{ km/h}`,
        questionText: "Determinar la distancia escalar total recorrida \\(d\\):",
        options: [
          `${1500 * qNum} km`,
          `${2100 * qNum} km`,
          `${1200 * qNum} km`,
          `${900 * qNum} km`
        ]
      };
    });

    // Cargar interfaz
    document.addEventListener("DOMContentLoaded", () => {
      buildGrid();
      renderQuestion();
    });

    function buildGrid() {
      const grid = document.getElementById("questions-grid");
      grid.innerHTML = "";
      
      for (let i = 0; i < TOTAL_QUESTIONS; i++) {
        const btn = document.createElement("button");
        btn.className = "q-btn";
        btn.id = `q-btn-${i}`;
        btn.innerText = i + 1;
        btn.onclick = () => jumpToQuestion(i);
        grid.appendChild(btn);
      }
      updateGridState();
    }

    function renderQuestion() {
      const q = examData[currentQuestionIndex];
      const card = document.getElementById("question-card");
      const selected = answers[currentQuestionIndex];

      card.innerHTML = `
        <div class="topic-tag">${q.topic}</div>
        <div class="question-title">Pregunta ${q.id} de ${TOTAL_QUESTIONS}</div>
        <div class="question-statement">${q.statement}</div>
        <div class="equation-container">\\[${q.equation}\\]</div>
        <div class="question-statement">${q.questionText}</div>
        
        <div class="options-list">
          ${q.options.map((opt, idx) => `
            <label class="option-card ${selected === idx ? 'selected' : ''}" onclick="selectOption(${idx})">
              <input type="radio" name="option" ${selected === idx ? 'checked' : ''}>
              <span>${opt}</span>
            </label>
          `).join('')}
        </div>
      `;

      // Reprocesar MathJax para ecuaciones LaTeX
      if (window.MathJax) {
        MathJax.typesetPromise([card]);
      }

      // Deshabilitar navegación si estamos al inicio/final
      document.getElementById("btn-prev").disabled = currentQuestionIndex === 0;
      document.getElementById("btn-next").innerText = currentQuestionIndex === TOTAL_QUESTIONS - 1 ? "Finalizar" : "Siguiente ►";

      updateGridState();
    }

    function selectOption(optIndex) {
      answers[currentQuestionIndex] = optIndex;
      renderQuestion();
      updateProgress();
    }

    function jumpToQuestion(index) {
      currentQuestionIndex = index;
      renderQuestion();
    }

    function navigate(direction) {
      const nextIndex = currentQuestionIndex + direction;
      if (nextIndex >= 0 && nextIndex < TOTAL_QUESTIONS) {
        currentQuestionIndex = nextIndex;
        renderQuestion();
      }
    }

    function updateGridState() {
      for (let i = 0; i < TOTAL_QUESTIONS; i++) {
        const btn = document.getElementById(`q-btn-${i}`);
        if (!btn) continue;

        btn.className = "q-btn";
        if (answers[i] !== null) btn.classList.add("answered");
        if (i === currentQuestionIndex) btn.classList.add("current");
      }
    }

    function updateProgress() {
      const count = answers.filter(a => a !== null).length;
      document.getElementById("progress-text").innerText = `Respondidas: ${count} / ${TOTAL_QUESTIONS}`;
    }
  </script>
</body>
</html>
