<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Evaluación - Física</title>
  
  <!-- Configuración e integración de MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    .container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }
    
    .main-content { flex: 1; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .sidebar { width: 280px; display: flex; flex-direction: column; gap: 15px; }
    
    .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .category { color: #0088cc; font-weight: bold; text-transform: uppercase; font-size: 13px; margin-bottom: 5px; }
    .question-number { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
    
    .formula-box { background: #f8fafc; border-left: 4px solid #0088cc; padding: 15px; margin: 15px 0; text-align: center; font-size: 1.1em; }
    
    .options { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .option-label { border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: background 0.2s; }
    .option-label:hover { background: #f1f5f9; }
    
    .grid-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
    .nav-btn { padding: 8px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; text-align: center; font-size: 12px; }
    .nav-btn.active { border-color: #0088cc; background: #e0f2fe; color: #0088cc; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <main class="main-content">
    <div class="category" id="categoria">TRABAJO MECÁNICO</div>
    <div class="question-number" id="pregunta-titulo">Pregunta 13 de 40</div>
    
    <div id="enunciado">
      <!-- El texto con LaTeX se inyectará dinámicamente -->
    </div>

    <div class="options" id="opciones-container">
      <!-- Opciones inyectadas dinámicamente -->
    </div>
  </main>

  <aside class="sidebar">
    <div class="card">
      <small style="color: #64748b; font-weight: bold;">TIEMPO RESTANTE</small>
      <div style="font-size: 28px; font-weight: bold;">59:46</div>
    </div>

    <div class="card">
      <small style="color: #64748b; font-weight: bold;">ESTADO DEL EXAMEN</small>
      <div style="margin-top: 5px;">Respondidas: <strong>0 / 40</strong></div>
    </div>

    <div class="card">
      <small style="color: #64748b; font-weight: bold;">NAVEGACIÓN DIRECTA</small>
      <div class="grid-nav" id="grid-navegacion">
        <!-- Botones creados automáticamente -->
      </div>
    </div>
  </aside>
</div>

<script>
  // Banco de preguntas con escapes de barra invertida (\\) requeridos por JavaScript
  const preguntas = [
    {
      id: 13,
      categoria: "TRABAJO MECÁNICO",
      textoInicial: "Una fuerza $\\vec{F} = (6\\hat{i} + 8\\hat{j})\\text{ N}$ desplaza un objeto a lo largo del vector:",
      ecuacionDestacada: "$$\\Delta \\vec{r} = (5\\hat{i} + 2\\hat{j})\\text{ m}$$",
      textoFinal: "Calcular el trabajo escalar realizado $W = \\vec{F} \\cdot \\Delta \\vec{r}$:",
      opciones: ["46 J", "30 J", "16 J", "70 J"]
    }
  ];

  function cargarPregunta(index) {
    const data = preguntas[index];
    
    document.getElementById("categoria").innerText = data.categoria;
    document.getElementById("pregunta-titulo").innerText = `Pregunta ${data.id} de 40`;
    
    // Inyección de HTML con sintaxis LaTeX
    document.getElementById("enunciado").innerHTML = `
      <p>${data.textoInicial}</p>
      <div class="formula-box">${data.ecuacionDestacada}</div>
      <p>${data.textoFinal}</p>
    `;

    const contenedorOpciones = document.getElementById("opciones-container");
    contenedorOpciones.innerHTML = "";

    data.opciones.forEach((opcion, i) => {
      const label = document.createElement("label");
      label.className = "option-label";
      label.innerHTML = `
        <input type="radio" name="pregunta_${data.id}" value="${i}">
        <span>${opcion}</span>
      `;
      contenedorOpciones.appendChild(label);
    });

    // RE-RENDERIZAR MATHJAX TRAS CAMBIAR EL CONTENIDO EN EL DOM
    if (window.MathJax && window.MathJax.typesetPromise) {
      MathJax.typesetPromise();
    }
  }

  // Generar cuadrícula de navegación simple
  const grid = document.getElementById("grid-navegacion");
  for (let i = 1; i <= 40; i++) {
    const btn = document.createElement("div");
    btn.className = `nav-btn ${i === 13 ? 'active' : ''}`;
    btn.innerText = i;
    grid.appendChild(btn);
  }

  // Cargar la pregunta inicial al iniciar la página
  window.addEventListener("DOMContentLoaded", () => {
    cargarPregunta(0);
  });
</script>

</body>
</html>
